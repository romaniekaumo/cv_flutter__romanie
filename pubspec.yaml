name: cv_flutter_kaumo_kipongo_romanie
description: "Application mobile Flutter personnelle présentant le CV de KAUMO KIPONGO ROMANIE, la famille et les coordonnées."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  url_launcher: ^6.3.1
  google_fonts: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/famille/
    - assets/icons/